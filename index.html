<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Тренажёр слов — Английский</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#1a73e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Слова" />

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
      color: #222;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #1a73e8; }
    h2 { border-bottom: 2px solid #1a73e8; padding-bottom: 4px; }
    section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: monospace;
    }
    button {
      background: #1a73e8;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 8px;
      margin-top: 6px;
    }
    button:hover { background: #1557b0; }
    button:disabled { background: #aaa; cursor: default; }
    button.ghost {
      background: #fff;
      color: #1a73e8;
      border: 1px solid #1a73e8;
    }
    button.purple { background: #7b5cf0; }
    button.purple:hover { background: #5f43d6; }

    /* ТАБЛИЦА СЛОВ */
    #words-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      margin: 10px 0;
    }
    #words-table th {
      border: 1px solid #ddd;
      padding: 8px;
      background: #f5f7fa;
      font-size: 14px;
      text-align: left;
    }
    #words-table td {
      border: 1px solid #ddd;
      padding: 4px 6px;
      vertical-align: middle;
    }
    #words-table td input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 15px;
      word-break: break-word;
    }
    #words-table td input:focus { outline: 2px solid #1a73e8; border-radius: 4px; }
    #words-table td button { padding: 4px 10px; background: #e53935; margin: 0; }
    #words-table th:nth-child(1), #words-table td:nth-child(1) { width: 35%; }
    #words-table th:nth-child(2), #words-table td:nth-child(2) { width: 35%; }
    #words-table th:nth-child(3), #words-table td:nth-child(3) { width: 22%; }
    #words-table th:nth-child(4), #words-table td:nth-child(4) { width: 8%; text-align: center; }

    #photo-preview { max-width: 300px; display: none; margin-top: 10px; border-radius: 8px; }
    #status-msg { color: #1a73e8; font-weight: 600; min-height: 20px; }

    .mode-switch { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
    .mode-switch .label { font-weight: 600; }
    .toggle { position: relative; width: 56px; height: 30px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider-t { position: absolute; inset: 0; background: #c8cdd8; border-radius: 30px;
                transition: background .2s; cursor: pointer; }
    .slider-t::before { content: ''; position: absolute; width: 24px; height: 24px;
                left: 3px; top: 3px; background: #fff; border-radius: 50%;
                transition: transform .2s; }
    .toggle input:checked + .slider-t { background: #7b5cf0; }
    .toggle input:checked + .slider-t::before { transform: translateX(26px); }
    .beta-badge { font-size: 11px; background: #ffedd5; color: #c2560a; padding: 2px 8px;
                  border-radius: 8px; font-weight: 700; }

    .quiz-card {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 20px;
      margin-top: 12px;
      text-align: center;
    }
    .quiz-card .word { font-size: 28px; font-weight: 700; margin: 10px 0; }
    .options { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .options button {
      background: #f0f4ff;
      color: #222;
      border: 1px solid #c9d6f0;
      margin: 0;
      padding: 12px;
      font-size: 16px;
    }
    .options button:hover:not(:disabled) { background: #dce7fb; }
    .options button.correct { background: #c8f2d4; border-color: #34a853; color: #1e7e34; }
    .options button.wrong { background: #fdd; border-color: #e53935; color: #b71c1c; }
    .feedback { font-weight: 700; margin-top: 12px; min-height: 24px; }
    .feedback.ok { color: #2e7d32; }
    .feedback.fail { color: #c62828; }
    input.answer-input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }
    .mode-row { margin-bottom: 10px; }
    .mode-row label { margin-right: 12px; cursor: pointer; }
    #stats { font-weight: 600; color: #555; }
    .bar { height: 8px; background: #e0e0e0; border-radius: 4px; margin-top: 8px; overflow: hidden; }
    .bar > div { height: 100%; background: #1a73e8; width: 0; transition: width 0.3s; }
    .hint { font-size: 13px; color: #777; margin-top: 6px; }

    .res-card { text-align: left; }
    .res-score { font-size: 24px; font-weight: 800; }
    .chart { margin: 12px 0; }
    .chart-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .chart-word { width: 110px; font-size: 13px; overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; }
    .chart-bar { flex: 1; height: 16px; background: #eee; border-radius: 8px; overflow: hidden; }
    .chart-fill { height: 100%; border-radius: 8px; transition: width .5s; }
    .chart-fill.good { background: #34a853; }
    .chart-fill.bad  { background: #e53935; }
    .chart-stat { width: 60px; font-size: 12px; color: #666; text-align: right; }
    .summary { font-size: 14px; background: #f6f7ff; border-radius: 10px; padding: 12px; margin-top: 10px; }
    .dialog-btns { display: flex; gap: 8px; margin-top: 14px; justify-content: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Тренажёр слов — Английский</h1>

    <section>
      <h2>1. Загрузи фото и распознай</h2>
      <div class="mode-switch">
        <span class="label">Обычное</span>
        <label class="toggle">
          <input type="checkbox" id="neural-mode" />
          <span class="slider-t"></span>
        </label>
        <span class="label">Нейро</span>
        <span class="beta-badge">бета</span>
      </div>
      <input type="file" id="photo-input" accept="image/*" />
      <p class="hint">Совет: снимай ТОЛЬКО таблицу со словами, крупно и ровно (сверху вниз, без наклона и тени). Чем чище кадр — тем точнее распознавание.</p>
      <img id="photo-preview" alt="Предпросмотр" />
      <p id="status-msg"></p>
      <textarea id="raw-text" rows="6" placeholder="Распознанный текст появится здесь (или вставь текст вручную)"></textarea>
    </section>

    <section>
      <h2>2. Список слов</h2>
      <button id="parse-btn">Разобрать текст</button>
      <button id="autotr-btn" class="ghost">Автоперевод 🌐</button>
      <button id="add-row-btn" class="ghost">Добавить строку</button>
      <table id="words-table">
        <thead>
          <tr><th>Слово</th><th>Перевод</th><th>Пример</th><th></th></tr>
        </thead>
        <tbody id="words-tbody"></tbody>
      </table>
      <button id="save-list-btn">Сохранить список</button>
      <button id="clear-list-btn" class="ghost">Очистить список</button>
    </section>

    <section>
      <h2>3. Викторина</h2>
      <div class="mode-row">
        <label><input type="radio" name="direction" value="en-ru" checked /> Слово → Перевод</label>
        <label><input type="radio" name="direction" value="ru-en" /> Перевод → Слово</label>
        <label><input type="radio" name="mode" value="choice" checked /> С вариантами</label>
        <label><input type="radio" name="mode" value="typing" /> Ввод текста</label>
      </div>
      <button id="start-quiz-btn">Начать викторину</button>
      <div id="quiz-area"></div>
      <p id="stats"></p>
      <div class="bar"><div id="progress-fill"></div></div>
    </section>
  </div>

  <script src="https://unpkg.com/tesseract.js@4.1.0/dist/tesseract.min.js"></script>
  <script>
    // ==================== ОБЩЕЕ ====================
    const input = document.getElementById('photo-input');
    const preview = document.getElementById('photo-preview');
    const rawText = document.getElementById('raw-text');
    const statusMsg = document.getElementById('status-msg');
    const neuralToggle = document.getElementById('neural-mode');

    function setStatus(text) {
      statusMsg.textContent = text;
    }

    // ==================== 1. OCR ====================

    function preprocessImage(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 1600;
          const scale = Math.min(1, maxW / img.width) * (img.width < 1000 ? 2 : 1);
          const canvas = document.createElement('canvas');
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const d = imageData.data;
          const contrast = 1.4;
          for (let i = 0; i < d.length; i += 4) {
            const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
            let v = (gray - 128) * contrast + 128;
            v = Math.max(0, Math.min(255, v));
            d[i] = d[i + 1] = d[i + 2] = v;
          }
          ctx.putImageData(imageData, 0, 0);
          resolve(canvas);
        };
        img.src = URL.createObjectURL(file);
      });
    }

    function sliceLines(img) {
      const W = 600, H = 1200;
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, W, H);
      const data = ctx.getImageData(0, 0, W, H).data;
      const dark = new Array(H).fill(0);
      for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++)
          if (data[(y * W + x) * 4] < 160) dark[y]++;

      const spans = [];
      let start = null;
      for (let y = 0; y <= H; y++) {
        const row = y < H && dark[y] > 3;
        if (row && start === null) start = y;
        else if (!row && start !== null) {
          if (y - start >= 12) spans.push([start, y]);
          start = null;
        }
      }
      return spans.map(([a, b]) => {
        const top = a / H * img.height, bot = b / H * img.height;
        const h = Math.max(32, Math.round((bot - top) / img.width * 384));
        const lc = document.createElement('canvas');
        lc.width = 384; lc.height = h;
        lc.getContext('2d').drawImage(img, 0, top, img.width, bot - top, 0, 0, 384, h);
        return lc;
      });
    }

    // НЕЙРО: TrOCR в браузере
    let neuralPipe = null;
    async function runNeuralOCR(file) {
      if (!neuralPipe) {
        setStatus('Загружаю нейросеть (один раз, ~150 МБ)...');
        const { pipeline, env } = await import(
          'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3');
        env.allowLocalModels = false;
        neuralPipe = await pipeline('image-to-text', 'Xenova/trocr-base-handwritten', {
          progress_callback: p => {
            if (p.progress) setStatus('Загрузка модели: ' + Math.round(p.progress) + '%');
          },
        });
      }
      const img = await createImageBitmap(file);
      const lines = sliceLines(img);
      const out = [];
      for (let i = 0; i < lines.length; i++) {
        setStatus('Нейро: строчка ' + (i + 1) + ' из ' + lines.length);
        const r = await neuralPipe(lines[i], { max_new_tokens: 64 });
        out.push(r[0].generated_text.trim());
      }
      return out.filter(Boolean).join('\n') || '(текст не найден)';
    }

    input.addEventListener('change', async () => {
      const file = input.files[0];
      if (!file) return;

      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      setStatus('Готовлю фото...');

      try {
        let text;
        if (neuralToggle.checked) {
          text = await runNeuralOCR(file);
        } else {
          const canvas = await preprocessImage(file);
          setStatus('Распознаю...');
          const res = await Tesseract.recognize(canvas, 'eng+rus', {
            logger: m => {
              if (m.status === 'recognizing text') {
                setStatus('Прогресс: ' + Math.round(m.progress * 100) + '%');
              }
            }
          });
          text = res.data.text;
        }
        rawText.value = text;
        const pairs = extractPairs(text);
        setStatus('Готово! Нашёл ' + pairs.length + ' пар слов. Проверь текст, поправь ошибки и жми «Разобрать текст».');
      } catch (err) {
        console.error(err);
        setStatus('Ошибка при распознавании: ' + err.message);
      }
    });

    // ==================== ПАРСЕР СЛОВАРЯ ====================
    function cleanJunk(s) {
      return s
        .replace(/[^A-Za-zА-ЯЁа-яё'’()\-\s.,]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function isMostlyLatin(s) {
      const latin = (s.match(/[A-Za-z]/g) || []).length;
      const cyr = (s.match(/[А-ЯЁа-яё]/g) || []).length;
      return latin >= 2 && latin > cyr;
    }

    function isMostlyCyrillic(s) {
      const latin = (s.match(/[A-Za-z]/g) || []).length;
      const cyr = (s.match(/[А-ЯЁа-яё]/g) || []).length;
      return cyr >= 2 && cyr > latin;
    }

    function validPair(word, translation) {
      if (word.split(' ').length > 5 || translation.split(' ').length > 5) return false;
      if (!/[A-Za-z]{3,}/.test(word)) return false;
      if (!/[А-ЯЁа-яё]{3,}/.test(translation)) return false;
      return true;
    }

    function extractPairs(text) {
      const pairs = [];
      const lines = text.split('\n').map(cleanJunk).filter(l => l.length > 1);
      const used = new Set();

      // 1) пары в одной строке: "слово - перевод" или "слово перевод"
      lines.forEach((line, i) => {
        let m = line.match(/^(.{2,50}?)\s*[-—–:]+\s*(.{2,60})$/);
        if (m && isMostlyLatin(m[1]) && isMostlyCyrillic(m[2]) && validPair(m[1].trim(), m[2].trim())) {
          pairs.push({ word: m[1].trim(), translation: m[2].trim(), example: '' });
          used.add(i);
          return;
        }
        m = line.match(/^([A-Za-z][A-Za-z'’()\-\s.]{1,49}?)\s+([А-ЯЁа-яё][А-ЯЁа-яё'’()\-\s,]{1,59})$/);
        if (m && validPair(m[1].trim(), m[2].trim())) {
          pairs.push({ word: m[1].trim(), translation: m[2].trim(), example: '' });
          used.add(i);
        }
      });

      // 2) столбик: английская строка + русская строка следом
      for (let i = 0; i < lines.length; i++) {
        if (used.has(i) || !isMostlyLatin(lines[i])) continue;
        for (let j = i + 1; j < lines.length && j <= i + 2; j++) {
          if (used.has(j)) continue;
          if (isMostlyCyrillic(lines[j])) {
            if (validPair(lines[i], lines[j])) {
              pairs.push({ word: lines[i], translation: lines[j], example: '' });
              used.add(i); used.add(j);
            }
            break;
          }
          if (isMostlyLatin(lines[j])) break;
        }
      }

      return pairs;
    }

    // ==================== 2. СЛОВАРЬ ====================
    let currentWords = JSON.parse(localStorage.getItem('vocab_list') || '[]');
    const tbody = document.getElementById('words-tbody');

    function renderTable() {
      tbody.innerHTML = '';
      currentWords.forEach((item, index) => {
        const tr = document.createElement('tr');

        const tdWord = document.createElement('td');
        const tdTrans = document.createElement('td');
        const tdExample = document.createElement('td');
        const tdDelete = document.createElement('td');

        const wordInput = document.createElement('input');
        wordInput.type = 'text';
        wordInput.value = item.word;
        wordInput.addEventListener('input', () => { currentWords[index].word = wordInput.value; });

        const transInput = document.createElement('input');
        transInput.type = 'text';
        transInput.value = item.translation;
        transInput.addEventListener('input', () => { currentWords[index].translation = transInput.value; });

        const exampleInput = document.createElement('input');
        exampleInput.type = 'text';
        exampleInput.placeholder = 'Пример предложения';
        exampleInput.value = item.example || '';
        exampleInput.addEventListener('input', () => { currentWords[index].example = exampleInput.value; });

        const delBtn = document.createElement('button');
        delBtn.textContent = 'X';
        delBtn.addEventListener('click', () => {
          currentWords.splice(index, 1);
          renderTable();
        });

        tdWord.appendChild(wordInput);
        tdTrans.appendChild(transInput);
        tdExample.appendChild(exampleInput);
        tdDelete.appendChild(delBtn);

        tr.appendChild(tdWord);
        tr.appendChild(tdTrans);
        tr.appendChild(tdExample);
        tr.appendChild(tdDelete);
        tbody.appendChild(tr);
      });
    }

    document.getElementById('parse-btn').addEventListener('click', () => {
      const text = rawText.value;
      if (!text.trim()) {
        setStatus('Сначала загрузи фото или вставь текст!');
        return;
      }

      const foundWords = extractPairs(text);

      if (foundWords.length === 0) {
        setStatus('Пар не нашёл. Убедись, что на фото только таблица со словами (формат: «word - перевод», по одному в строке).');
        return;
      }

      const seen = new Set();
      const unique = foundWords.filter(p => {
        const key = p.word.toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });

      currentWords = unique;
      renderTable();
      setStatus('Нашёл ' + unique.length + ' слов. При необходимости поправь ячейки, затем жми «Сохранить список».');
    });

    // авто-перевод строк без перевода
    document.getElementById('autotr-btn').addEventListener('click', async () => {
      const need = currentWords.filter(w => w.word && !w.translation);
      if (!need.length) {
        setStatus('У всех слов уже есть перевод.');
        return;
      }
      for (let i = 0; i < need.length; i++) {
        setStatus('Перевожу: ' + (i + 1) + ' из ' + need.length + ' (' + need[i].word + ')');
        try {
          const dir = /[A-Za-z]/.test(need[i].word) ? 'en|ru' : 'ru|en';
          const r = await fetch('https://api.mymemory.translated.net/get?q=' +
            encodeURIComponent(need[i].word) + '&langpair=' + dir);
          const j = await r.json();
          const t = j.responseData && j.responseData.translatedText || '';
          if (t && !t.includes('MYMEMORY WARNING')) need[i].translation = t;
        } catch (e) { /* пропускаем неудачи */ }
      }
      renderTable();
      localStorage.setItem('vocab_list', JSON.stringify(currentWords));
      setStatus('Перевёл ' + need.length + ' слов. Список сохранён.');
    });

    document.getElementById('add-row-btn').addEventListener('click', () => {
      currentWords.push({ word: '', translation: '', example: '' });
      renderTable();
    });

    document.getElementById('save-list-btn').addEventListener('click', () => {
      localStorage.setItem('vocab_list', JSON.stringify(currentWords));
      setStatus('Список сохранён (' + currentWords.length + ' слов). Он останется после перезагрузки страницы.');
    });

    document.getElementById('clear-list-btn').addEventListener('click', () => {
      if (confirm('Удалить все слова?')) {
        currentWords = [];
        localStorage.removeItem('vocab_list');
        renderTable();
        setStatus('Список очищен.');
      }
    });

    renderTable();

    // ==================== 3. ВИКТОРИНА ====================
    const quizArea = document.getElementById('quiz-area');
    const stats = document.getElementById('stats');
    const progressFill = document.getElementById('progress-fill');

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startQuizRound(wordList) {
      const validWords = wordList.filter(w => w.word && w.translation);
      if (validWords.length < 1) {
        setStatus('Для викторины нужно хотя бы одно слово с переводом!');
        return;
      }

      const direction = document.querySelector('input[name="direction"]:checked').value;
      let mode = document.querySelector('input[name="mode"]:checked').value;
      if (validWords.length < 4) mode = 'typing';
      const shuffled = shuffle(validWords);
      let currentIndex = 0;
      let score = 0;
      const answered = [];

      function question() {
        return direction === 'en-ru'
          ? { prompt: shuffled[currentIndex].word, correct: shuffled[currentIndex].translation }
          : { prompt: shuffled[currentIndex].translation, correct: shuffled[currentIndex].word };
      }

      function showProgress() {
        stats.textContent = 'Прогресс: ' + (currentIndex + 1) + ' / ' + shuffled.length + ' | Счёт: ' + score;
        progressFill.style.width = (currentIndex / shuffled.length * 100) + '%';
      }

      function showResults() {
        progressFill.style.width = '100%';
        const wrong = answered.filter(a => !a.correct);
        const total = answered.length;
        const pct = Math.round((total - wrong.length) / total * 100);

        let verdict;
        if (pct === 100)    verdict = 'Идеально! Так держать 🔥';
        else if (pct >= 70) verdict = 'Сильный результат! Осталось добить парочку.';
        else if (pct >= 40) verdict = 'Половина за тобой — но есть над чем поработать.';
        else                verdict = 'Слова сложные — повторим их отдельно!';

        let chart = '';
        answered.forEach(a => {
          const w = Math.max(8, Math.round(100 / total));
          chart += '<div class="chart-row">' +
            '<div class="chart-word">' + a.item.word + '</div>' +
            '<div class="chart-bar"><div class="chart-fill ' + (a.correct ? 'good' : 'bad') +
            '" style="width:' + (a.correct ? w : w * 0.35) + '%"></div></div>' +
            '<div class="chart-stat">' + (a.correct ? '✅ верно' : '❌ мимо') + '</div>' +
            '</div>';
        });

        const pull = wrong.length
          ? '<div class="summary">📝 <b>Подтянуть:</b> ' +
            wrong.map(a => a.item.word + ' → ' + a.item.translation).join(', ') + '</div>'
          : '<div class="summary">🎉 Ошибок нет — словарик освоен!</div>';

        const dialog = wrong.length
          ? '<div style="font-weight:700;margin-top:14px">Сделать викторину из ошибочных слов?</div>' +
            '<div class="dialog-btns">' +
            '<button class="ghost" id="stay-btn">Остаться</button>' +
            '<button class="purple" id="go-bro-btn">Давай броооу!</button>' +
            '</div>'
          : '';

        quizArea.innerHTML =
          '<div class="quiz-card res-card">' +
          '<h3>Результат: ' + (total - wrong.length) + ' / ' + total + ' (' + pct + '%)</h3>' +
          '<p>' + verdict + '</p>' +
          '<div class="chart">' + chart + '</div>' +
          pull + dialog +
          '</div>';
        stats.textContent = '';

        if (wrong.length) {
          document.getElementById('stay-btn').addEventListener('click', () => {
            quizArea.innerHTML = '';
            progressFill.style.width = '0';
          });
          document.getElementById('go-bro-btn').addEventListener('click', () => {
            startQuizRound(wrong.map(a => a.item));
          });
        }
      }

      function finish() {
        showResults();
      }

      function next() {
        currentIndex++;
        if (currentIndex >= shuffled.length) finish();
        else render();
      }

      function render() {
        quizArea.innerHTML = '';
        showProgress();
        const q = question();
        const card = document.createElement('div');
        card.className = 'quiz-card';

        const label = document.createElement('div');
        label.textContent = mode === 'choice'
          ? 'Выбери правильный ответ:'
          : 'Напиши перевод:';
        const wordEl = document.createElement('div');
        wordEl.className = 'word';
        wordEl.textContent = q.prompt;
        card.appendChild(label);
        card.appendChild(wordEl);

        const feedback = document.createElement('p');
        feedback.className = 'feedback';

        function recordAnswer(isRight) {
          answered.push({ item: shuffled[currentIndex], correct: isRight });
        }

        if (mode === 'choice') {
          const wrongs = shuffle(validWords.filter(w => w !== shuffled[currentIndex])).slice(0, 3);
          const options = shuffle([q.correct, ...wrongs.map(w => direction === 'en-ru' ? w.translation : w.word)]);

          const optionsBox = document.createElement('div');
          optionsBox.className = 'options';

          options.forEach(opt => {
            const btn = document.createElement('button');
            btn.textContent = opt;
            btn.addEventListener('click', () => {
              const isRight = opt === q.correct;
              [...optionsBox.children].forEach(b => {
                b.disabled = true;
                if (b.textContent === q.correct) b.classList.add('correct');
              });
              if (isRight) {
                score++;
                feedback.textContent = 'Верно! 🎉';
                feedback.className = 'feedback ok';
              } else {
                btn.classList.add('wrong');
                feedback.textContent = 'Мимо! Правильный ответ: ' + q.correct;
                feedback.className = 'feedback fail';
              }
              recordAnswer(isRight);
              const nextBtn = document.createElement('button');
              nextBtn.textContent = 'Дальше →';
              nextBtn.addEventListener('click', next);
              card.appendChild(nextBtn);
            });
            optionsBox.appendChild(btn);
          });
          card.appendChild(optionsBox);
        } else {
          const answerInput = document.createElement('input');
          answerInput.className = 'answer-input';
          answerInput.placeholder = 'Твой ответ...';
          const checkBtn = document.createElement('button');
          checkBtn.textContent = 'Проверить';

          function check() {
            const answer = answerInput.value.trim().toLowerCase();
            const correct = q.correct.trim().toLowerCase();
            answerInput.disabled = true;
            checkBtn.disabled = true;
            const isRight = answer === correct;
            if (isRight) {
              score++;
              feedback.textContent = 'Верно! 🎉';
              feedback.className = 'feedback ok';
            } else {
              feedback.textContent = 'Мимо! Правильный ответ: ' + q.correct;
              feedback.className = 'feedback fail';
            }
            recordAnswer(isRight);
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Дальше →';
            nextBtn.addEventListener('click', next);
            card.appendChild(nextBtn);
          }

          checkBtn.addEventListener('click', check);
          answerInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !checkBtn.disabled) check();
          });

          card.appendChild(answerInput);
          card.appendChild(checkBtn);
        }

        card.appendChild(feedback);
        quizArea.appendChild(card);
        const focusTarget = card.querySelector('.answer-input');
        if (focusTarget) focusTarget.focus();
      }

      render();
    }

    document.getElementById('start-quiz-btn').addEventListener('click', () => {
      const valid = currentWords.filter(w => w.word && w.translation);
      const noTrans = currentWords.filter(w => w.word && !w.translation).length;
      if (!valid.length) {
        setStatus('Нет ни одного слова с переводом. Нажми «Автоперевод» или заполни переводы руками.');
        return;
      }
      if (noTrans) setStatus('Внимание: ' + noTrans + ' слов без перевода — они в викторину не попадут. Жми «Автоперевод».');
      startQuizRound(valid);
    });
  </script>
</body>
</html>
