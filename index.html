<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR — фото в текст</title>
<link rel="manifest" href="manifest.json">
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 16px;
         background: #f5f6fa; color: #222; }
  h1 { font-size: 22px; }
  .switch { display: flex; align-items: center; gap: 10px; margin: 16px 0;
            background: #fff; padding: 12px 16px; border-radius: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .switch .label { font-weight: 600; user-select: none; }
  .toggle { position: relative; width: 56px; height: 30px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #c8cdd8; border-radius: 30px;
            transition: background .2s; cursor: pointer; }
  .slider::before { content: ''; position: absolute; width: 24px; height: 24px;
            left: 3px; top: 3px; background: #fff; border-radius: 50%;
            transition: transform .2s; }
  .toggle input:checked + .slider { background: #7b5cf0; }
  .toggle input:checked + .slider::before { transform: translateX(26px); }
  #badge { font-size: 11px; background: #ffedd5; color: #c2560a; padding: 2px 8px;
           border-radius: 8px; font-weight: 700; }
  input[type=file] { margin: 8px 0; width: 100%; }
  button { padding: 14px 20px; font-size: 16px; border-radius: 12px; border: 0;
           background: #4f6ef7; color: #fff; cursor: pointer; width: 100%; }
  button:disabled { opacity: .5; }
  #result { width: 100%; min-height: 180px; margin-top: 12px; border-radius: 10px;
            padding: 10px; font-size: 15px; }
  #status { color: #666; min-height: 22px; margin-top: 8px; font-size: 14px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .mini { padding: 10px; font-size: 14px; background: #fff; color: #333;
          border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.1); width: 100%; }
  .mini:disabled { opacity: .4; }
  .history-toggle { margin-top: 14px; background: #eef; }
  #historyList { margin-top: 8px; }
  .hist-item { background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
               cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .hist-item .txt { font-size: 13px; color: #444; white-space: nowrap;
                    overflow: hidden; text-overflow: ellipsis; }
  .hist-item .date { font-size: 11px; color: #999; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px;
          overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  td, th { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 15px; text-align: left; }
  th { background: #f0f1f7; font-size: 13px; }
  .q-card { background: #fff; border-radius: 12px; padding: 16px; margin: 10px 0;
            box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .q-word { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
  .q-opt { display: block; width: 100%; margin: 6px 0; padding: 12px; font-size: 15px;
           border-radius: 10px; border: 1px solid #ddd; background: #fafafa; cursor: pointer; }
  .q-opt.ok  { background: #d4f7d4; border-color: #4caf50; }
  .q-opt.bad { background: #ffd6d6; border-color: #e53935; }
  /* ---- диаграмма ---- */
  .res-card { background: #fff; border-radius: 14px; padding: 18px; margin: 12px 0;
              box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .res-title { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
  .res-score { font-size: 26px; font-weight: 800; }
  .chart { margin: 12px 0; }
  .chart-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .chart-word { width: 90px; font-size: 13px; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; }
  .chart-bar { flex: 1; height: 18px; background: #eee; border-radius: 9px; overflow: hidden; }
  .chart-fill { height: 100%; border-radius: 9px; transition: width .5s; }
  .chart-fill.good { background: #4caf50; }
  .chart-fill.bad  { background: #e53935; }
  .chart-stat { width: 58px; font-size: 12px; color: #666; text-align: right; }
  .summary { font-size: 14px; background: #f6f7ff; border-radius: 10px; padding: 12px; }
  .summary b { color: #c2560a; }
  .dialog-btns { display: flex; gap: 8px; margin-top: 14px; }
  .dialog-btns .mini { font-weight: 700; }
  .btn-stay { background: #eee !important; color: #333 !important; box-shadow: none; }
  .btn-go { background: #7b5cf0 !important; color: #fff !important; box-shadow: none; }
</style>
</head>
<body>
<h1>📷 Фото → текст</h1>

<div class="switch">
  <span class="label" id="labelBasic">Обычное</span>
  <label class="toggle">
    <input type="checkbox" id="modeToggle">
    <span class="slider"></span>
  </label>
  <span class="label">Нейро</span>
  <span id="badge">бета</span>
</div>

<input type="file" accept="image/*" capture="environment" id="photo">
<button id="go">Распознать</button>
<div id="status"></div>

<div class="actions">
  <button class="mini" id="copyBtn">📋 Копировать</button>
  <button class="mini" id="shareBtn">↗ Поделиться</button>
  <button class="mini" id="saveBtn">💾 Скачать .txt</button>
  <button class="mini" id="clearBtn">✖ Очистить</button>
</div>
<textarea id="result" placeholder="Текст появится здесь..."></textarea>

<button class="mini history-toggle" id="historyBtn">🕘 История (<span id="histCount">0</span>)</button>
<div id="historyList"></div>

<hr>
<div id="tableSection" style="display:none">
  <h2>📚 Слова с переводом</h2>
  <div id="tableWrap"></div>
  <button id="quizBtn" style="background:#7b5cf0;margin-top:12px">🎯 Сгенерировать викторину</button>
</div>

<div id="quizSection" style="display:none">
  <h2>🎯 Викторина</h2>
  <div id="quizBox"></div>
</div>

<script type="module">
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const photoEl  = document.getElementById('photo');
const goBtn    = document.getElementById('go');
const toggle   = document.getElementById('modeToggle');

const isNeural = () => toggle.checked;

// ---------- нарезка листа на строчки ----------
function sliceLines(img) {
  const W = 600, H = 1200;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, W, H);
  const data = ctx.getImageData(0, 0, W, H).data;
  const dark = new Array(H).fill(0);
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++)
      if (data[(y * W + x) * 4] < 160) dark[y]++;

  const spans = [];
  let start = null;
  for (let y = 0; y <= H; y++) {
    const row = y < H && dark[y] > 3;
    if (row && start === null) start = y;
    else if (!row && start !== null) {
      if (y - start >= 12) spans.push([start, y]);
      start = null;
    }
  }
  return spans.map(([a, b]) => {
    const top = a / H * img.height, bot = b / H * img.height;
    const h = Math.max(32, Math.round((bot - top) / img.width * 384));
    const lc = document.createElement('canvas');
    lc.width = 384; lc.height = h;
    lc.getContext('2d').drawImage(img, 0, top, img.width, bot - top, 0, 0, 384, h);
    return lc;
  });
}

// ---------- ОБЫЧНОЕ: Tesseract ----------
async function runBasic(file) {
  statusEl.textContent = 'Обычное распознавание...';
  const { createWorker } = await import(
    'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.esm.min.js');
  const worker = await createWorker('rus+eng');
  const { data: { text } } = await worker.recognize(file);
  await worker.terminate();
  return text;
}

// ---------- НЕЙРО: TrOCR в браузере ----------
let neuralPipe = null;
async function runNeural(file) {
  if (!neuralPipe) {
    statusEl.textContent = 'Загружаю нейросеть (один раз, ~150 МБ)...';
    const { pipeline, env } = await import(
      'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3');
    env.allowLocalModels = false;
    neuralPipe = await pipeline('image-to-text', 'Xenova/trocr-base-handwritten', {
      progress_callback: p => {
        if (p.progress) statusEl.textContent = `Загрузка модели: ${Math.round(p.progress)}%`;
      },
    });
  }
  const img = await createImageBitmap(file);
  const lines = sliceLines(img);
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    statusEl.textContent = `Нейро: строчка ${i + 1} из ${lines.length}`;
    const r = await neuralPipe(lines[i], { max_new_tokens: 64 });
    out.push(r[0].generated_text.trim());
  }
  return out.filter(Boolean).join('\n') || '(текст не найден)';
}

// ---------- история ----------
function saveHistory(text, mode) {
  const hist = JSON.parse(localStorage.getItem('ocr_history') || '[]');
  hist.unshift({ text, mode, date: new Date().toLocaleString('ru-RU') });
  localStorage.setItem('ocr_history', JSON.stringify(hist.slice(0, 50)));
  renderHistory();
}

function renderHistory() {
  const hist = JSON.parse(localStorage.getItem('ocr_history') || '[]');
  document.getElementById('histCount').textContent = hist.length;
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  hist.forEach(h => {
    const div = document.createElement('div');
    div.className = 'hist-item';
    div.innerHTML = `<div class="date">${h.date} · ${h.mode}</div><div class="txt"></div>`;
    div.querySelector('.txt').textContent = h.text;
    div.addEventListener('click', () => { resultEl.value = h.text; });
    list.appendChild(div);
  });
}
renderHistory();

// ---------- словарь ----------
const STOP = new Set(['и','в','на','с','а','но','не','что','как','это','для','он','она',
  'они','мы','вы','the','and','a','an','of','to','is','are','in','on','it','was','were']);

function extractWords(text) {
  const raw = (text.toLowerCase().match(/[a-zа-яё][a-zа-яё-]{2,}/g) || []);
  const seen = new Set(), words = [];
  for (const w of raw) {
    if (STOP.has(w) || seen.has(w)) continue;
    seen.add(w); words.push(w);
  }
  return words.slice(0, 15);
}

async function translateWord(w) {
  const dir = /[a-z]/.test(w) ? 'en|ru' : 'ru|en';
  const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(w)}&langpair=${dir}`);
  const j = await r.json();
  const t = j.responseData?.translatedText || '';
  return (t && !t.includes('MYMEMORY WARNING')) ? t : '—';
}

let wordPairs = [];   // [{word, tr}]

async function buildTable(text) {
  const words = extractWords(text);
  if (!words.length) { statusEl.textContent = 'Слов для словарика не нашёл'; return; }
  document.getElementById('tableSection').style.display = 'block';
  document.getElementById('quizSection').style.display = 'none';
  const wrap = document.getElementById('tableWrap');
  wrap.innerHTML = '<table><tr><th>Слово</th><th>Перевод</th></tr>' +
                   words.map(w => `<tr><td>${w}</td><td>...</td></tr>`).join('') + '</table>';
  wordPairs = [];
  for (let i = 0; i < words.length; i++) {
    statusEl.textContent = `Перевод: ${i + 1} из ${words.length}`;
    const tr = await translateWord(words[i]);
    wordPairs.push({ word: words[i], tr });
    wrap.querySelectorAll('td')[i * 2 + 1].textContent = tr;
  }
  statusEl.textContent = `Готово ✅ Слов: ${wordPairs.length}. Жми «Сгенерировать викторину»!`;
}

// ---------- викторина ----------
const shuffle = a => [...a].sort(() => Math.random() - .5);

function startQuiz(pairs) {
  if (!pairs.length) { statusEl.textContent = 'Нет слов для викторины'; return; }
  document.getElementById('quizSection').style.display = 'block';
  const box = document.getElementById('quizBox');
  box.innerHTML = '';
  let score = 0;
  const answered = [];   // [{pair, correct}]
  const questions = shuffle(pairs).slice(0, 10);

  questions.forEach((q, qi) => {
    // дистракторы: из всего словарика, чтобы вариантов всегда хватало
    const others = shuffle(wordPairs.filter(p => p.tr !== q.tr && p.tr !== '—')).slice(0, 3);
    const opts = shuffle([q.tr, ...others.map(p => p.tr)]);
    const card = document.createElement('div');
    card.className = 'q-card';
    card.innerHTML = `<div class="q-word">${qi + 1}. ${q.word}</div>` +
      opts.map(o => `<button class="q-opt">${o}</button>`).join('');
    let done = false;
    card.querySelectorAll('.q-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        if (done) return;
        done = true;
        const correct = btn.textContent === q.tr;
        if (correct) { btn.classList.add('ok'); score++; }
        else {
          btn.classList.add('bad');
          card.querySelectorAll('.q-opt').forEach(b =>
            b.textContent === q.tr && b.classList.add('ok'));
        }
        answered.push({ pair: q, correct });
        if (answered.length === questions.length) showResults(answered);
      });
    });
    box.appendChild(card);
  });
}

// ---------- результаты: диаграмма + подтянуть + диалог ----------
function showResults(answered) {
  const box = document.getElementById('quizBox');
  const wrong = answered.filter(a => !a.correct);
  const total = answered.length;
  const pct = Math.round((total - wrong.length) / total * 100);

  const card = document.createElement('div');
  card.className = 'res-card';

  let verdict;
  if (pct === 100)      verdict = 'Идеально! Так держать 🔥';
  else if (pct >= 70)   verdict = 'Сильный результат! Осталось добить парочку.';
  else if (pct >= 40)   verdict = 'Половина за тобой — но есть над чем поработать.';
  else                  verdict = 'Слова сложные — повторим их отдельно!';

  let chart = '';
  answered.forEach(a => {
    const w = Math.max(8, Math.round(100 / total));
    chart += `<div class="chart-row">
      <div class="chart-word">${a.pair.word}</div>
      <div class="chart-bar"><div class="chart-fill ${a.correct ? 'good' : 'bad'}"
        style="width:${a.correct ? w : w * 0.35}%"></div></div>
      <div class="chart-stat">${a.correct ? '✅ верно' : '❌ мимо'}</div>
    </div>`;
  });

  const pull = wrong.length
    ? `<div class="summary">📝 <b>Подтянуть:</b> ${wrong.map(a =>
        `${a.pair.word} → ${a.pair.tr}`).join(', ')}</div>`
    : `<div class="summary">🎉 Ошибок нет — словарик освоен!</div>`;

  card.innerHTML = `
    <div class="res-title">Результат</div>
    <div class="res-score">${total - wrong.length} / ${total} (${pct}%)</div>
    <div style="font-size:14px;color:#555;margin:4px 0 6px">${verdict}</div>
    <div class="chart">${chart}</div>
    ${pull}
    ${wrong.length ? `
    <div style="font-weight:700;margin-top:14px">Сделать викторину из ошибочных слов?</div>
    <div class="dialog-btns">
      <button class="mini btn-stay" id="stayBtn">Остаться</button>
      <button class="mini btn-go" id="goBroBtn">Давай броооу!</button>
    </div>` : ''}`;

  // убрать старый блок результатов, если был
  box.querySelectorAll('.res-card').forEach(el => el.remove());
  box.appendChild(card);
  card.scrollIntoView({ behavior: 'smooth' });

  if (wrong.length) {
    card.querySelector('#stayBtn').addEventListener('click', () => card.remove());
    card.querySelector('#goBroBtn').addEventListener('click', () => {
      card.remove();
      startQuiz(wrong.map(a => a.pair));
    });
  }
}

document.getElementById('quizBtn').addEventListener('click', () => startQuiz(wordPairs));

// ---------- кнопки действия ----------
document.getElementById('copyBtn').addEventListener('click', async () => {
  if (!resultEl.value) return;
  await navigator.clipboard.writeText(resultEl.value);
  statusEl.textContent = 'Скопировано ✅';
});

document.getElementById('shareBtn').addEventListener('click', async () => {
  if (!resultEl.value) return;
  if (navigator.share) {
    try { await navigator.share({ text: resultEl.value }); } catch {}
  } else {
    await navigator.clipboard.writeText(resultEl.value);
    statusEl.textContent = 'Шаринг недоступен — скопировал в буфер';
  }
});

document.getElementById('saveBtn').addEventListener('click', () => {
  if (!resultEl.value) return;
  const blob = new Blob([resultEl.value], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ocr_' + Date.now() + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  resultEl.value = '';
  photoEl.value = '';
  statusEl.textContent = '';
  document.getElementById('tableSection').style.display = 'none';
  document.getElementById('quizSection').style.display = 'none';
});

// ---------- распознать ----------
goBtn.addEventListener('click', async () => {
  const file = photoEl.files[0];
  if (!file) { statusEl.textContent = 'Сначала выбери фото 📷'; return; }
  goBtn.disabled = true;
  resultEl.value = '';
  try {
    resultEl.value = isNeural() ? await runNeural(file) : await runBasic(file);
    saveHistory(resultEl.value, isNeural() ? 'нейро' : 'обычное');
    buildTable(resultEl.value);
  } catch (e) {
    statusEl.textContent = 'Ошибка: ' + e.message;
  } finally {
    goBtn.disabled = false;
  }
});
</script>
</body>
</html>
